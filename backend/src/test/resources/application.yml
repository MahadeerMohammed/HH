spring:
  datasource:
    url: jdbc:h2:mem:hotelhub;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

app:
  auth:
    jwt-secret: test-secret-value-with-at-least-32-bytes
    access-token-minutes: 15
    refresh-token-days: 14
    issuer: test-suite
    secure-cookies: false
    same-site: Strict
  cors:
    allowed-origins:
      - http://localhost:5173
  bootstrap:
    admin-email: admin@test.local
    admin-password: TestPassword123!
    admin-full-name: Test Admin
    seed-sample-data: false
