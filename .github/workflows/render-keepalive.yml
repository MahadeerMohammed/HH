name: Render Keep Alive

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

concurrency:
  group: render-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Render health endpoint
        env:
          KEEPALIVE_URL: ${{ secrets.RENDER_KEEPALIVE_URL }}
        run: |
          if [ -z "$KEEPALIVE_URL" ]; then
            echo "RENDER_KEEPALIVE_URL secret is not set"
            exit 1
          fi

          for attempt in 1 2 3; do
            if curl --fail --silent --show-error \
              --connect-timeout 5 \
              --max-time 60 \
              -H "User-Agent: HotelHubKeepAlive/1.0" \
              -H "Cache-Control: no-cache" \
              "$KEEPALIVE_URL" \
              >/dev/null; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              sleep 20
            fi
          done

          exit 1
