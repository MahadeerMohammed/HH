server:
  port: ${PORT:${SERVER_PORT:8080}}
  forward-headers-strategy: framework

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hotelhub}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  auth:
    jwt-secret: ${JWT_SECRET:aGzLr9s2XvYpQmKjNbWdFxCzA4BmN7RsT5UqPwJkL3M=}
    access-token-minutes: ${ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${REFRESH_TOKEN_DAYS:14}
    issuer: ${JWT_ISSUER:hotelhub-admin}
    secure-cookies: ${SECURE_COOKIES:false}
    same-site: ${COOKIE_SAME_SITE:Strict}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8100}
  bootstrap:
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:admin@hotelhub.local}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:ChangeMe123!}
    admin-full-name: ${BOOTSTRAP_ADMIN_FULL_NAME:Hotel Admin}
    seed-sample-data: ${BOOTSTRAP_SAMPLE_DATA:true}
