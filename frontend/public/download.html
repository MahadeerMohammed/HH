<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HotelHub Admin Download</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #172026;
        --muted: #5f6b72;
        --line: #d9e1e5;
        --panel: #ffffff;
        --page: #f4f7f8;
        --brand: #0f766e;
        --brand-dark: #115e59;
        --accent: #2563eb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          linear-gradient(120deg, rgba(15, 118, 110, 0.10), transparent 44%),
          linear-gradient(240deg, rgba(37, 99, 235, 0.12), transparent 48%),
          var(--page);
        color: var(--ink);
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 720px);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: 0 24px 80px rgba(23, 32, 38, 0.14);
        overflow: hidden;
      }

      .hero {
        display: grid;
        gap: 16px;
        padding: clamp(28px, 6vw, 52px);
        border-bottom: 1px solid var(--line);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 800;
        font-size: clamp(28px, 6vw, 44px);
        line-height: 1;
      }

      .mark {
        display: grid;
        place-items: center;
        width: 52px;
        height: 52px;
        border-radius: 8px;
        background: var(--brand);
        color: white;
        font-weight: 900;
        flex: 0 0 auto;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 17px;
        line-height: 1.6;
      }

      .actions {
        display: grid;
        gap: 12px;
        padding: clamp(24px, 5vw, 40px);
      }

      a {
        color: inherit;
      }

      .button {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 52px;
        padding: 14px 20px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 800;
        border: 1px solid transparent;
      }

      .button.primary {
        background: var(--brand);
        color: white;
      }

      .button.primary:hover {
        background: var(--brand-dark);
      }

      .button.secondary {
        border-color: var(--line);
        color: var(--ink);
        background: white;
      }

      .note {
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="hero">
        <div class="brand">
          <span class="mark">H</span>
          <span>HotelHub Admin</span>
        </div>
        <p>Install the Android admin app for room, revenue, expense, and report management.</p>
      </section>
      <section class="actions">
        <a class="button primary" href="/downloads/hotelhub-admin.apk" download>
          Download Android APK
        </a>
        <a class="button secondary" href="https://hotelhub-api-rldv.onrender.com/actuator/health">
          Check Backend Status
        </a>
        <p class="note">Version 1.0.0. Android may ask you to allow installation from your browser before opening the APK.</p>
      </section>
    </main>
  </body>
</html>
